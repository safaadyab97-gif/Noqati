name: build-apk.yml

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q Noqati-Android-Prototype.zip -d project
          find project -name gradlew -type f -exec chmod +x {} \;

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          chmod +x "$GRADLEW"
          "$GRADLEW" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noqati-APK
          path: project/**/build/outputs/apk/**/*.apk
